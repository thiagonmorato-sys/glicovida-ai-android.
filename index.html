<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0866d8"><title>GlicoVida AI • V5 Android (teste)</title><style>
:root{--blue:#0866d8;--teal:#0aa99a;--ink:#17324d;--muted:#63798e;--bg:#f2f7fc;--line:#dce7f1}*{box-sizing:border-box}body{margin:0;background:#dce9f3;font:15px system-ui,-apple-system,Roboto,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}#app{max-width:480px;min-height:100dvh;margin:auto;background:var(--bg);padding-bottom:90px;box-shadow:0 0 35px #163b6020}.top{background:linear-gradient(125deg,#0866d8,#0aa99a);color:white;padding:calc(20px + env(safe-area-inset-top)) 20px 23px;border-radius:0 0 24px 24px}.top small{opacity:.85}.top h1{font-size:23px;margin:5px 0}.content{padding:16px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;margin:0 0 13px;box-shadow:0 3px 12px #123c6010}.card h3{margin:0 0 10px;font-size:16px}.muted{color:var(--muted);font-size:13px}.pill{display:inline-block;border-radius:20px;padding:5px 10px;background:#e5f7f3;color:#087b6b;font-size:12px}.btn{border:0;background:var(--blue);color:white;border-radius:12px;padding:12px 15px;font-weight:650}.btn.alt{background:#eaf3ff;color:#0857ae}.btn.warn{background:#fff0e9;color:#aa4e26}.btn.full{width:100%;margin-top:9px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{border:1px solid var(--line);border-radius:14px;background:#fff;padding:17px 10px;text-align:center;color:var(--ink);min-height:92px}.tile b{display:block;margin-top:8px;font-size:13px}.big{font-size:35px;font-weight:800;color:var(--blue)}label{display:block;font-weight:600;font-size:13px;margin:12px 0 5px}input,select,textarea{width:100%;border:1px solid #cdddea;border-radius:11px;background:#fff;padding:12px;color:var(--ink)}textarea{min-height:75px}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;display:flex;background:#fff;border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}nav button{flex:1;border:0;background:none;color:#597187;font-size:11px;padding:7px 2px}nav button.active{color:var(--blue);font-weight:800}nav span{display:block;font-size:20px}.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.link{border:0;background:transparent;color:var(--blue);font-weight:650;padding:5px}.notice{background:#fff9e9;border:1px solid #f4dfac;border-radius:12px;padding:11px;font-size:12px;color:#725b27;margin-bottom:12px}.bar{height:11px;border-radius:10px;background:#e5edf6;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}.chat{border-radius:13px;padding:12px;margin-bottom:9px;max-width:90%;background:#fff;border:1px solid var(--line)}.chat.me{margin-left:auto;background:#e4f1ff}.tiny{font-size:11px}.back{color:white;background:none;border:0;padding:0;font-size:14px}.chart{display:flex;align-items:end;gap:9px;height:135px;border-bottom:1px solid #cbdbe8;padding:10px 4px}.chart div{flex:1;background:linear-gradient(#0aa99a,#0866d8);border-radius:6px 6px 0 0;min-height:5px;position:relative}.chart span{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:10px;color:#63798e}.toggle{display:flex;align-items:center;gap:8px;margin:12px 0}.toggle input{width:auto}.splash{padding:42px 18px;text-align:center}.logo{font-size:70px}.hidden{display:none!important}@media(min-width:550px){#app{margin:24px auto;min-height:850px;border-radius:25px;overflow:hidden}nav{bottom:0}}

.authnote{border-radius:12px;padding:12px;background:#e9f5ff;border:1px solid #badcf5;font-size:13px;margin:12px 0}.status{border-radius:12px;padding:10px;margin:10px 0;font-size:13px;background:#e7f5ef;color:#145b47}.error{background:#fff0ef;color:#973a31}.subtle{font-size:12px;color:var(--muted)}
.days-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:8px 0}.day-option{display:flex;align-items:center;gap:5px;background:#f2f7fc;border:1px solid var(--line);border-radius:10px;padding:8px 6px;font-size:12px;font-weight:600}.day-option input{width:auto;margin:0}.reminder-card{border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0;background:#fff}.reminder-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.reminder-actions .btn{flex:1;min-width:110px}.status-chip{display:inline-block;border-radius:20px;padding:4px 8px;font-size:11px;background:#e8f5ef;color:#176246}.status-chip.pending{background:#fff4df;color:#805c16}.status-chip.off{background:#eef1f5;color:#596b7c}.form-hint{font-size:12px;color:var(--muted);line-height:1.45}.med-meta{font-size:12px;color:var(--muted);margin-top:4px}</style></head><body><div id="app"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>window.__glicoNativeReady = new Promise(resolve => { window.__resolveGlicoNativeReady = resolve; });</script><script type="module" src="/src/native-notifications.js"></script><script>
const screens={welcome:'Boas-vindas',signup:'Cadastro',login:'Entrar',home:'Início',glucose:'Registrar glicemia',history:'Histórico e gráficos',meds:'Medicamentos',food:'Alimentação',nutrition:'Análise nutricional',family:'Minha família',ai:'Glico AI',reports:'Relatórios',settings:'Ajustes e perfil',carehome:'Painel do cuidador',caredetail:'Pessoa acompanhada',invites:'Convites e permissões',reminders:'Central de lembretes'};
const defaults={role:'patient',name:'Usuário',glucose:[],meds:[],meals:[],family:[],invites:[],messages:[{who:'bot',text:'Olá! Posso explicar conceitos gerais sobre diabetes e ajudar a organizar dúvidas para a consulta. Não faço diagnósticos nem indico doses.'}],reminders:[{title:'Conferir medicamentos prescritos',time:'08:00',done:false}],sharing:true};
let data=structuredClone(defaults);let current='welcome',historyStack=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{};function go(s){if(s==='caredetail'&&current!=='caredetail')caregiverMeasurements=[];if(!session && !['welcome','signup','login','setup'].includes(s))s='login';if(session && s==='signup')s=data.role==='caregiver'?'carehome':'home';if(session&&s==='carehome'&&data.role==='patient')s='home';if(session&&s==='home'&&data.role==='caregiver')s='carehome';if(current!==s)historyStack.push(current);current=s;render();scrollTo(0,0)}function back(){current=historyStack.pop()||'home';render()}function switchRole(r){if(session){alert('O tipo de conta é definido no cadastro e não pode ser alternado aqui.');return;}data.role=r;go(r==='caregiver'?'carehome':'home')};const btn=(text,to,cls='')=>`<button class="btn ${cls}" onclick="go('${to}')">${text}</button>`;const tile=(emoji,name,to)=>`<button class="tile" onclick="go('${to}')"><span style="font-size:26px">${emoji}</span><b>${name}</b></button>`;function head(title,subtitle){return `<header class="top">${!['home','carehome','welcome'].includes(current)?'<button class="back" onclick="back()">← Voltar</button>':''}<h1>${title}</h1><small>${subtitle||'GlicoVida AI • Glicemia Testes V4 demonstrativo'}</small></header>`}function field(label,id,type='text',placeholder=''){return `<label for="${id}">${label}</label><input id="${id}" type="${type}" placeholder="${placeholder}" ${type==='date'?'value="'+new Date().toISOString().slice(0,10)+'"':''}>`};function card(title,html){return `<section class="card"><h3>${title}</h3>${html}</section>`};function notice(){return `<div class="notice">🧪 AMBIENTE DE TESTE: os registros de glicemia deste pacote são fictícios. Os lembretes são salvos no Supabase para testes. Não utilize esta versão para decisões de tratamento ou emergências.</div>`}let client=null,session=null; let links=[], familyBusy=false, generatedInvite=""; let glucoseBusy=false, caregiverMeasurements=[]; let permissionStates={};
let medicationReminders=[], medicationEvents=[], reminderMonitor=null, reminderBusy=false;
const WEEKDAYS=[['Dom',0],['Seg',1],['Ter',2],['Qua',3],['Qui',4],['Sex',5],['Sáb',6]];
function localDateString(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`;}
function localDayStart(d=new Date()){return new Date(d.getFullYear(),d.getMonth(),d.getDate(),0,0,0,0);}
function reminderOccurrence(r,base=new Date()){
 const day=base.getDay(); if(!Array.isArray(r.days_of_week)||!r.days_of_week.includes(day))return null;
 const today=localDateString(base); if(r.start_date&&today<r.start_date)return null; if(r.end_date&&today>r.end_date)return null;
 const hm=String(r.schedule_time||'').slice(0,5).split(':'); if(hm.length!==2)return null;
 const dt=new Date(base.getFullYear(),base.getMonth(),base.getDate(),Number(hm[0]),Number(hm[1]),0,0);
 return Number.isNaN(dt.getTime())?null:dt;
}
function reminderEventFor(id,occurrence){return medicationEvents.find(e=>e.reminder_id===id&&Math.abs(new Date(e.scheduled_for).getTime()-occurrence.getTime())<1000)||null;}
function reminderKindLabel(k){return k==='insulin'?'Insulina':k==='meal'?'Refeição':'Medicamento';}
function reminderDaysLabel(days){return WEEKDAYS.filter(x=>Array.isArray(days)&&days.includes(x[1])).map(x=>x[0]).join(', ');}
function setReminderMessage(text,bad=false){const el=$('medmsg')||$('remindermsg');if(el){el.className='status'+(bad?' error':'');el.textContent=text;}else alert(text);}

function setMessage(message,isError=false){let el=$('authmsg');if(el){el.className='status'+(isError?' error':'');el.textContent=message;}else alert(message)}
function makeClient(){try{let url=localStorage.getItem('glico_url')||sessionStorage.getItem('glico_url'),key=localStorage.getItem('glico_key')||sessionStorage.getItem('glico_key');if(url&&key&&window.supabase){client=window.supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});return true}}catch(e){console.warn('Configuração inválida',e)}return false}
function setupStatus(message, bad=false){const el=$('setupmsg');if(el){el.textContent=message;el.className='status'+(bad?' error':'');el.style.display='block';}}
function configureSupabase(){
  const rawUrl=($('sburl')?.value||'').trim().replace(/[\u200B-\u200D\uFEFF]/g,'').replace(/^[\"'`]+|[\"'`]+$/g,'').trim();
  const key=($('sbkey')?.value||'').trim();
  if(!rawUrl || !key){setupStatus('Preencha os dois campos: Project URL e Publishable key.',true);return;}
  let url;
  try {
    const parsed=new URL(rawUrl);
    if(parsed.protocol!=='https:' || !/^[a-z0-9-]+\.supabase\.co$/i.test(parsed.hostname) || parsed.username || parsed.password || parsed.port || (parsed.pathname!=='/' && parsed.pathname!=='') || parsed.search || parsed.hash){
      setupStatus('Este campo precisa conter somente a Project URL de Data API, como https://identificador.supabase.co (sem caminho ou parâmetros). Confira se não copiou o endereço do painel.',true);return;
    }
    url=parsed.origin;
  } catch(e){setupStatus('Endereço inválido: copie a Project URL em Supabase → Project Settings → Data API. Deve começar com https://',true);return;}
  if(!/^sb_publishable_[A-Za-z0-9_-]+$/.test(key)){setupStatus('A chave deve começar com sb_publishable_. Não utilize service_role nem sb_secret_.',true);return;}
  if(!window.supabase?.createClient){setupStatus('A biblioteca Supabase não carregou. Confirme a conexão com a internet. Se abriu pelo gerenciador de arquivos, teste depois em um site HTTPS.',true);return;}
  try{
    localStorage.setItem('glico_url',url);
    localStorage.setItem('glico_key',key);
    sessionStorage.setItem('glico_url',url);
    sessionStorage.setItem('glico_key',key);
    client=null;
    if(!makeClient()) throw new Error('Falha ao inicializar o cliente');
    setupStatus('Configuração salva nesta aba! Agora toque em Ir ao cadastro ou Ir ao login. A comunicação com o servidor será testada na autenticação.');
  }catch(e){setupStatus('Não foi possível salvar no navegador: '+(e?.message||String(e))+'. Tente abrir pelo Chrome em endereço HTTPS.',true);}
}
function forgetConfig(){localStorage.removeItem('glico_url');localStorage.removeItem('glico_key');sessionStorage.removeItem('glico_url');sessionStorage.removeItem('glico_key');client=null;session=null;data=structuredClone(defaults);go('welcome')}
async function signup(){if(!client)return go('setup');let full_name=$('regname').value.trim(),email=$('regemail').value.trim(),password=$('regpass').value,role=$('regrole').value;if(full_name.length<2||!email.includes('@')||password.length<8)return setMessage('Preencha nome, e-mail e senha de pelo menos 8 caracteres.',true);setMessage('Criando conta...');let response,error;try{({data:response,error}=await client.auth.signUp({email,password,options:{data:{full_name,role}}}));}catch(e){return setMessage('Falha de rede no cadastro: '+e.message,true)}if(error)return setMessage('Não foi possível criar a conta: '+error.message,true);if(response.session){await finishAuth(response.session);return;}setMessage('Cadastro enviado. Confira seu e-mail e confirme a conta. Depois abra Entrar.');}
async function signIn(){if(!client)return go('setup');let email=$('loginemail').value.trim(),password=$('loginpass').value;setMessage('Entrando...');let response,error;try{({data:response,error}=await client.auth.signInWithPassword({email,password}));}catch(e){return setMessage('Falha de rede no login: '+e.message,true)}if(error)return setMessage('Falha no login: '+error.message,true);await finishAuth(response.session)}
async function finishAuth(newSession){if(!newSession?.user)return;let {data:profile,error}=await client.from('profiles').select('id,full_name,role').eq('id',newSession.user.id).single();if(error||!profile){session=null;setMessage('Autenticação realizada, mas não foi possível carregar seu perfil. Verifique o trigger e as políticas RLS.',true);return;}session=newSession;data=structuredClone(defaults);data.name=profile.full_name||'Usuário';data.role=profile.role==='caregiver'?'caregiver':'patient';historyStack=[];links=[];generatedInvite="";permissionStates={};caregiverMeasurements=[];medicationReminders=[];medicationEvents=[];if(data.role==='patient'){try{await loadMedicationReminders();}catch(e){console.error('Falha ao carregar lembretes',e);}}go(data.role==='caregiver'?'carehome':'home')}
async function signOut(){if(client){let {error}=await client.auth.signOut();if(error)return alert('Não foi possível sair: '+error.message)}if(reminderMonitor){clearInterval(reminderMonitor);reminderMonitor=null;}session=null;data=structuredClone(defaults);historyStack=[];links=[];generatedInvite="";permissionStates={};caregiverMeasurements=[];medicationReminders=[];medicationEvents=[];go('login')}
async function startApp(){if(!makeClient()){current='welcome';render();return;}try{let {data:r}=await client.auth.getSession();if(r.session){await finishAuth(r.session);if(session)return}}catch(e){console.warn(e)}current='login';render()}
function render(){if(!session&&!['welcome','setup','signup','login'].includes(current))current='login';if(session && current==='home' && data.role==='caregiver')current='carehome';if(session && current==='carehome' && data.role==='patient')current='home';let html='';switch(current){
case 'welcome':html=`<div class="splash"><div class="logo">💙</div><h1>GlicoVida AI</h1><p>Tecnologia que cuida.<br>Conexões que protegem.</p><p class="muted">Cadastro, glicemia de teste, vínculos familiares e lembretes de rotina conectados ao Supabase.</p>${btn('Configurar conexão','setup','full')}${btn('Criar conta','signup','alt full')}${btn('Já tenho conta','login','alt full')}</div>`;break;
case 'setup':html=head('Conectar ao Supabase','Configure no seu aparelho, sem enviar chaves no chat')+`<main class="content">${card('Configuração pública',`<p class="subtle">Insira a Project URL e somente a Publishable key. Essas informações são públicas, mas nunca insira senha do banco, service_role ou sb_secret_.</p>${field('Project URL','sburl','url','https://projeto.supabase.co')}${field('Publishable key','sbkey','text','sb_publishable_...')}<button class="btn full" onclick="configureSupabase()">Salvar conexão neste navegador</button><div id="setupmsg" class="status" role="status" aria-live="polite" style="display:none"></div><p class="subtle">${client?'Conexão configurada.':'Nenhuma conexão configurada nesta aba.'}</p><button class="btn alt full" onclick="forgetConfig()">Esquecer configuração</button>`)}${btn('Ir ao cadastro','signup','full')}${btn('Ir ao login','login','alt full')}</main>`;break;
case 'signup':html=head('Criar conta','Cadastro real por e-mail')+`<main class="content">${!client?'<div class="notice">Configure o Supabase antes de cadastrar.</div>':''}${card('Dados da conta',`${field('Nome completo','regname','text','Nome de teste')}${field('E-mail','regemail','email','email-de-teste@exemplo.com')}${field('Senha','regpass','password','No mínimo 8 caracteres')}<label for="regrole">Tipo de conta</label><select id="regrole"><option value="patient">Paciente</option><option value="caregiver">Familiar ou cuidador</option></select><p class="subtle">Use somente dados fictícios para os primeiros testes. O papel selecionado não concede acesso aos dados de outra pessoa.</p><button class="btn full" onclick="signup()">Criar conta</button><div id="authmsg" role="status" aria-live="polite"></div>`)}${btn('Já tenho conta','login','alt full')}${btn('Configurar Supabase','setup','alt full')}</main>`;break;
case 'login':html=head('Entrar','Autenticação Supabase')+`<main class="content">${!client?'<div class="notice">Configure primeiro a conexão com o Supabase.</div>':''}${card('Minha conta',`${field('E-mail','loginemail','email','email@exemplo.com')}${field('Senha','loginpass','password','Sua senha')}<button class="btn full" onclick="signIn()">Entrar</button><div id="authmsg" role="status" aria-live="polite"></div>`)}${btn('Criar conta','signup','alt full')}${btn('Configurar Supabase','setup','alt full')}<p class="subtle">Se acabou de se cadastrar, confirme seu e-mail antes de entrar, caso a confirmação esteja habilitada.</p></main>`;break;
case 'home':html=head(`Olá, ${esc(data.name)}! 👋`,'Ambiente de testes · somente dados fictícios')+`<main class="content">${notice()}${card('Última glicemia registrada',`<div class="big">${data.glucose.length?esc(data.glucose[0].value):'—'} <small style="font-size:15px">mg/dL</small></div><p class="muted">${data.glucose.length?esc(data.glucose[0].date+' • '+data.glucose[0].time):'Sem registros'}</p>${btn('＋ Registrar glicemia','glucose','full')}<button class="btn alt full" onclick="loadOwnGlucose()">↻ Atualizar registros</button>`)}<div class="grid">${tile('📊','Histórico','history')}${tile('💊','Medicamentos','meds')}${tile('🔔','Lembretes','reminders')}${tile('🥗','Alimentação','food')}${tile('👨‍👩‍👧','Minha família','family')}${tile('🤖','Glico AI','ai')}${tile('📄','Relatórios','reports')}</div></main>`;break;
case 'glucose':html=head('Registrar glicemia','Exclusivamente para teste fictício')+`<main class="content">${notice()}${card('Nova medição',`${field('Valor (mg/dL)','gvalue','number','Ex.: 112')}${field('Data','gdate','date')}${field('Horário','gtime','time')}<label>Contexto</label><select id="gcontext"><option>Em jejum</option><option>Antes da refeição</option><option>Após refeição</option><option>Antes de dormir</option><option>Outro</option></select><label>Observações</label><textarea id="gnote" placeholder="Opcional"></textarea><label style="display:flex;align-items:center;gap:9px;margin:12px 0"><input type="checkbox" id="fakeconfirm" style="width:auto"> Confirmo que este valor é 100% fictício e usado somente para teste.</label><button class="btn full" onclick="addGlucose()">Salvar registro fictício no Supabase</button><div id="glucosemsg" role="status" aria-live="polite"></div>`)}</main>`;break;

}let nav=data.role==='caregiver'?[['🏠','Painel','carehome'],['👤','Pessoa','caredetail'],['🔔','Lembretes','reminders'],['🔐','Permissões','invites'],['⚙️','Ajustes','settings']]:[['🏠','Início','home'],['💧','Glicemia','glucose'],['🥗','Alimentação','food'],['👨‍👩‍👧','Família','family'],['☰','Mais','settings']];$('app').innerHTML=html+(!['welcome','signup','login'].includes(current)?`<nav>${nav.map(n=>`<button class="${current===n[2]?'active':''}" onclick="go('${n[2]}')"><span>${n[0]}</span>${n[1]}</button>`).join('')}</nav>`:'');}

function linksOverview(){if(!links.length)return '<p class="muted">Nenhum vínculo encontrado. Clique em Atualizar vínculos.</p>';return links.map(l=>`<div class="item"><b>${data.role==='patient'?'Cuidador':'Paciente'} • ${esc(String(data.role==='patient'?l.caregiver_id:l.patient_id).slice(0,8))}…</b><p class="muted">Estado: ${esc(l.status==='approved'?'Aprovado':l.status==='pending'?'Pendente':'Revogado')}</p>${data.role==='patient'&&l.status==='pending'?`<button class="btn full" onclick="familyApprove('${esc(l.id)}')">Aprovar cuidador</button>`:''}${data.role==='patient'&&l.status==='approved'?`<div class="item"><b>Permissão de glicemia fictícia:</b> ${permissionStates[l.id]===true?'ATIVADA':permissionStates[l.id]===false?'DESATIVADA':'Ainda não consultada'}<button class="btn alt full" onclick="readGlucosePermission('${esc(l.id)}')">Consultar permissão</button><button class="btn full" onclick="setGlucosePermission('${esc(l.id)}',true)">Autorizar leitura</button><button class="btn alt full" onclick="setGlucosePermission('${esc(l.id)}',false)">Bloquear leitura</button></div>`:''}${l.status!=='revoked'?`<button class="btn alt full" onclick="familyRevoke('${esc(l.id)}')">Revogar vínculo</button>`:''}</div>`).join('')}
function familyPanel(){let patient=data.role==='patient';return card('Acompanhamento familiar',`<p class="subtle">Convites, vínculos e testes de glicemia são sincronizados. A glicemia fictícia só poderá ser lida por cuidadores com vínculo aprovado E autorização específica. Outros dados permanecem privados.</p><button class="btn alt full" onclick="familyRefresh()">↻ Atualizar vínculos</button><div id="familymsg" class="status" role="status" aria-live="polite" style="display:none"></div>${linksOverview()}`)+(patient?card('Convidar cuidador',`<p>Gere um código temporário e compartilhe-o apenas com a pessoa escolhida. Ele vale 24 horas e só pode ser usado uma vez.</p><button class="btn full" onclick="familyGenerate()">Gerar código de convite</button>${generatedInvite?`<div class="status"><b>Código de uso único:</b><p style="overflow-wrap:anywhere">${esc(generatedInvite)}</p><button class="btn alt full" onclick="copyFamilyCode()">Copiar código</button><small>Não compartilhe publicamente. Um novo login não recupera esse código.</small></div>`:''}`):card('Aceitar convite',`<label for="inviteCode">Código recebido do paciente</label><input id="inviteCode" autocomplete="off" placeholder="Cole o código aqui"><button class="btn full" onclick="familyRedeem()">Aceitar convite</button><p class="muted">Após aceitar, o vínculo ficará pendente até o paciente aprovar.</p>`));}
function familyMessage(message,bad=false){let el=$('familymsg');if(el){el.style.display='block';el.className='status'+(bad?' error':'');el.textContent=message;}else alert(message)}
async function familyRefresh(){if(!client||!session)return familyMessage('Faça login antes de consultar vínculos.',true);try{caregiverMeasurements=[];let filter=data.role==='patient'?'patient_id':'caregiver_id';let {data:rows,error}=await client.from('caregiver_links').select('id,patient_id,caregiver_id,status,created_at').eq(filter,session.user.id).order('created_at',{ascending:false});if(error)throw error;links=rows||[];render();familyMessage('Vínculos atualizados.');}catch(e){familyMessage('Não foi possível consultar os vínculos: '+(e.message||e),true)}}
async function familyGenerate(){if(familyBusy)return;familyBusy=true;try{let {data:code,error}=await client.rpc('glico_create_invite');if(error)throw error;generatedInvite=code;render();familyMessage('Convite criado. Copie o código e compartilhe somente com o cuidador.');}catch(e){familyMessage('Erro ao gerar convite: '+(e.message||e),true)}finally{familyBusy=false}}
async function copyFamilyCode(){if(!generatedInvite)return;try{await navigator.clipboard.writeText(generatedInvite);familyMessage('Código copiado.')}catch(e){familyMessage('Selecione e copie o código manualmente.',true)}}
async function familyRedeem(){if(familyBusy)return;const code=$('inviteCode')?.value?.trim();if(!code)return familyMessage('Digite o código de convite.',true);if(!confirm('Aceitar este convite e solicitar vínculo com o paciente?'))return;familyBusy=true;try{let {error}=await client.rpc('glico_redeem_invite',{p_token:code});if(error)throw error;await familyRefresh();familyMessage('Convite aceito. Aguarde a aprovação do paciente.')}catch(e){familyMessage('Erro ao aceitar convite: '+(e.message||e),true)}finally{familyBusy=false}}
async function familyApprove(id){if(familyBusy||!confirm('Aprovar vínculo com este cuidador? Nenhum registro de saúde será compartilhado ainda.'))return;familyBusy=true;try{let {error}=await client.rpc('glico_approve_link',{p_link_id:id});if(error)throw error;await familyRefresh();familyMessage('Vínculo aprovado. A glicemia permanece privada até autorização específica.')}catch(e){familyMessage('Erro ao aprovar: '+(e.message||e),true)}finally{familyBusy=false}}
async function familyRevoke(id){if(familyBusy||!confirm('Revogar este vínculo familiar?'))return;familyBusy=true;try{let {error}=await client.rpc('glico_revoke_link',{p_link_id:id});if(error)throw error;await familyRefresh();familyMessage('Vínculo revogado. A próxima consulta de glicemia fica bloqueada.')}catch(e){familyMessage('Erro ao revogar: '+(e.message||e),true)}finally{familyBusy=false}}
async function addGlucose(){
 if(glucoseBusy||!client||!session||data.role!=='patient')return;
 const el=$('glucosemsg');const msg=(t,bad=false)=>{if(el){el.className='status'+(bad?' error':'');el.textContent=t;}};
 if(!$('fakeconfirm').checked)return msg('Confirme que os dados são fictícios.',true);
 let v=Number($('gvalue').value);if(!Number.isFinite(v)||v<=0||v>1000)return msg('Digite um número positivo apenas para teste.',true);
 const date=$('gdate').value,time=$('gtime').value||'12:00';if(!date)return msg('Informe a data.',true);
 const dt=new Date(date+'T'+time);if(Number.isNaN(dt.getTime()))return msg('Data ou horário inválido.',true);
 const note='[TESTE FICTÍCIO] '+$('gcontext').value+' - '+$('gnote').value.slice(0,200);
 glucoseBusy=true;msg('Salvando teste...');
 try{const {error}=await client.from('glucose_records').insert({patient_id:session.user.id,glucose_value:v,measured_at:dt.toISOString(),notes:note});if(error)throw error;await loadOwnGlucose(true);go('history');}
 catch(e){msg('Não foi possível salvar: '+(e.message||e),true)}finally{glucoseBusy=false}
}
async function loadOwnGlucose(silent=false){
 if(!client||!session||data.role!=='patient')return;
 try{const {data:rows,error}=await client.from('glucose_records').select('id,glucose_value,measured_at,notes').eq('patient_id',session.user.id).order('measured_at',{ascending:false}).limit(30);if(error)throw error;
 data.glucose=(rows||[]).filter(x=>String(x.notes||'').startsWith('[TESTE FICTÍCIO]')).map(x=>({value:x.glucose_value,date:new Date(x.measured_at).toLocaleDateString('pt-BR'),time:new Date(x.measured_at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),context:x.notes||'TESTE'}));
 render();if(!silent)alert('Registros fictícios atualizados.');}
 catch(e){alert('Erro ao consultar glicemia: '+(e.message||e));}
}
async function readGlucosePermission(id){
 try{const {data:allowed,error}=await client.rpc('glico_get_glucose_permission',{p_link_id:id});if(error)throw error;permissionStates[id]=allowed===true;render();familyMessage('Permissão consultada no Supabase.');}
 catch(e){familyMessage('Erro ao consultar permissão: '+(e.message||e),true)}
}
async function setGlucosePermission(id,allowed){
 if(!confirm(allowed?'Autorizar acesso de SOMENTE LEITURA aos dados fictícios de glicemia para este vínculo?':'Bloquear leitura de glicemia para este vínculo?'))return;
 try{const {error}=await client.rpc('glico_set_glucose_permission',{p_link_id:id,p_allow:allowed});if(error)throw error;permissionStates[id]=allowed;render();familyMessage(allowed?'Leitura autorizada para este vínculo.':'Leitura bloqueada para este vínculo.');}
 catch(e){familyMessage('Erro na autorização: '+(e.message||e),true)}
}
async function loadCaregiverGlucose(){
 if(!client||!session||data.role!=='caregiver')return;
 const el=$('careglucosemsg');const msg=(t,bad=false)=>{let e=$('careglucosemsg');if(e){e.style.display='block';e.className='status'+(bad?' error':'');e.textContent=t;}};
 msg('Verificando dados da sessão...');
 try{const {data:ls,error:le}=await client.from('caregiver_links').select('patient_id,status').eq('caregiver_id',session.user.id);if(le)throw le;
 const ids=[...new Set((ls||[]).filter(l=>l.status==='approved').map(l=>l.patient_id))];
 caregiverMeasurements=[];
 if(!ids.length){render();msg('Sem vínculos aprovados. Nenhum registro liberado.');return;}
 const {data:rows,error}=await client.from('glucose_records').select('glucose_value,measured_at,notes,patient_id').in('patient_id',ids).order('measured_at',{ascending:false}).limit(30);if(error)throw error;
 caregiverMeasurements=(rows||[]).filter(x=>String(x.notes||'').startsWith('[TESTE FICTÍCIO]'));
 render();msg(caregiverMeasurements.length?'Leitura permitida para registros fictícios retornados pela RLS.':'Nenhuma glicemia fictícia retornada. Pode ser ausência de permissão ou de registros.');
 }catch(e){caregiverMeasurements=[];render();msg('Consulta bloqueada ou falhou: '+(e.message||e),true)}
}
async function loadMedicationReminders(){if(!client||!session)return;const {data:rows,error}=await client.from('medication_reminders').select('id,user_id,label,reminder_type,schedule_time,days_of_week,start_date,end_date,timezone,notes,enabled,created_at').eq('user_id',session.user.id).order('schedule_time',{ascending:true});if(error)throw error;medicationReminders=rows||[];const start=localDayStart(new Date());const end=new Date(start);end.setDate(end.getDate()+14);const {data:events,error:eventError}=await client.from('medication_reminder_events').select('id,reminder_id,user_id,scheduled_for,status,snoozed_until,action_at').eq('user_id',session.user.id).gte('scheduled_for',start.toISOString()).lt('scheduled_for',end.toISOString());if(eventError)throw eventError;medicationEvents=events||[];if(window.__glicoNativeReady)await window.__glicoNativeReady;if(window.GlicoNativeNotifications?.isNative()){const syncResult=await window.GlicoNativeNotifications.sync(medicationReminders,medicationEvents);if(!syncResult.ok&&!syncResult.permissionNeeded)console.warn('Sincronização dos alertas Android:',syncResult.message);}startReminderMonitor();}
function todayReminderCards(){const today=new Date();const rows=medicationReminders.filter(r=>r.enabled&&reminderOccurrence(r,today)).sort((a,b)=>String(a.schedule_time).localeCompare(String(b.schedule_time)));if(!rows.length)return '<p class="muted">Nenhum lembrete programado para hoje. Confira os horários na área Medicamentos.</p>';return rows.map(r=>{const occ=reminderOccurrence(r,today);const ev=reminderEventFor(r.id,occ);const status=ev?.status==='confirmed_taken'?'Confirmado como realizado':ev?.status==='marked_not_taken'?'Marcado como não realizado':ev?.status==='snoozed'?'Adiado até '+new Date(ev.snoozed_until).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'Pendente';const done=ev?.status==='confirmed_taken'||ev?.status==='marked_not_taken';const action=r.reminder_type==='meal'?'Marcar refeição realizada':'Já tomei / apliquei';return `<div class="reminder-card"><div class="row"><b>${esc(r.label)}</b><span class="status-chip ${done?'':'pending'}">${esc(status)}</span></div><div class="med-meta">${reminderKindLabel(r.reminder_type)} · ${esc(String(r.schedule_time).slice(0,5))}</div>${r.notes?`<div class="med-meta">${esc(r.notes)}</div>`:''}${!done?`<div class="reminder-actions"><button class="btn" onclick="recordReminderEvent('${r.id}','confirmed_taken')">${action}</button><button class="btn alt" onclick="recordReminderEvent('${r.id}','snoozed')">Adiar 10 min</button><button class="btn warn" onclick="recordReminderEvent('${r.id}','marked_not_taken')">Não realizado</button></div>`:''}</div>`}).join('')}
async function addMed(){if(reminderBusy||!client||!session||data.role!=='patient')return;const label=$('medlabel').value.trim(),kind=$('medkind').value,time=$('medtime').value,days=[...document.querySelectorAll('input[name="medday"]:checked')].map(x=>Number(x.value)),notes=$('mednotes').value.trim();if(label.length<2)return setReminderMessage('Informe o nome do medicamento ou atividade.',true);if(!time)return setReminderMessage('Escolha o horário do lembrete.',true);if(!days.length)return setReminderMessage('Selecione pelo menos um dia da semana.',true);if(kind==='insulin'&&!/insulina/i.test(label))return setReminderMessage('Para tipo Insulina, informe um nome que identifique a insulina conforme a prescrição.',true);reminderBusy=true;setReminderMessage('Salvando lembrete...');try{const payload={user_id:session.user.id,label,reminder_type:kind,schedule_time:time,days_of_week:days,start_date:localDateString(),timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||'America/Sao_Paulo',notes:notes||null,enabled:true};const {error}=await client.from('medication_reminders').insert(payload);if(error)throw error;await loadMedicationReminders();render();setReminderMessage('Lembrete salvo com segurança no Supabase. Ative as notificações deste aparelho para receber avisos.');}catch(e){setReminderMessage('Não foi possível salvar. Verifique se executou a migração SQL da V5: '+(e.message||e),true);}finally{reminderBusy=false}}
async function toggleMedicationReminder(id,enabled){if(!client||!session)return;try{const {error}=await client.from('medication_reminders').update({enabled,updated_at:new Date().toISOString()}).eq('id',id).eq('user_id',session.user.id);if(error)throw error;await loadMedicationReminders();render();}catch(e){alert('Não foi possível atualizar o lembrete: '+(e.message||e));}}
async function deleteMedicationReminder(id){if(!client||!session||!confirm('Excluir este lembrete e seu histórico de confirmações?'))return;try{const {error}=await client.from('medication_reminders').delete().eq('id',id).eq('user_id',session.user.id);if(error)throw error;await loadMedicationReminders();render();}catch(e){alert('Não foi possível excluir o lembrete: '+(e.message||e));}}
async function recordReminderEvent(id,status){if(!client||!session)return;const reminder=medicationReminders.find(r=>r.id===id);if(!reminder)return;const occurrence=reminderOccurrence(reminder,new Date());if(!occurrence)return alert('Este lembrete não está programado para hoje.');const payload={reminder_id:id,user_id:session.user.id,scheduled_for:occurrence.toISOString(),status,action_at:new Date().toISOString(),snoozed_until:status==='snoozed'?new Date(Date.now()+10*60*1000).toISOString():null};try{const {error}=await client.from('medication_reminder_events').upsert(payload,{onConflict:'reminder_id,scheduled_for'});if(error)throw error;await loadMedicationReminders();render();setReminderMessage(status==='confirmed_taken'?'Confirmação registrada.':'Atualização do lembrete registrada.');}catch(e){setReminderMessage('Não foi possível registrar a ação: '+(e.message||e),true);}}
async function requestMedicationNotifications(){try{if(window.__glicoNativeReady)await window.__glicoNativeReady;if(window.GlicoNativeNotifications?.isNative()){const result=await window.GlicoNativeNotifications.requestAndSync(medicationReminders,medicationEvents);setReminderMessage(result.message,!result.ok);return;}if(!('Notification' in window)){setReminderMessage('Este navegador não oferece notificações. Instale a versão Android para usar alertas locais.',true);return;}const permission=await Notification.requestPermission();if(permission==='granted'){setReminderMessage('Notificações do navegador permitidas. Os avisos web dependem do navegador permanecer ativo.');checkReminderAlerts();}else setReminderMessage('Permissão de notificações não concedida. Ative-a nas configurações do navegador.',true);}catch(e){setReminderMessage('Não foi possível ativar as notificações: '+(e.message||e),true);}}
async function testNativeNotification(){try{if(window.__glicoNativeReady)await window.__glicoNativeReady;if(!window.GlicoNativeNotifications?.isNative()){setReminderMessage('O teste de notificação nativa só funciona no aplicativo Android instalado. O site Netlify continua sendo a versão web.',true);return;}const result=await window.GlicoNativeNotifications.test();setReminderMessage(result.message,!result.ok);}catch(e){setReminderMessage('Falha no teste de notificação: '+(e.message||e),true);}}
function checkReminderAlerts(){if(!session||data.role!=='patient'||!('Notification' in window)||Notification.permission!=='granted')return;const now=new Date();for(const r of medicationReminders){if(!r.enabled)continue;const occurrence=reminderOccurrence(r,now);if(!occurrence)continue;const ev=reminderEventFor(r.id,occurrence);if(ev?.status==='confirmed_taken'||ev?.status==='marked_not_taken')continue;let due=ev?.status==='snoozed'&&ev.snoozed_until?new Date(ev.snoozed_until):occurrence;if(now<due||now-due>60*60*1000)continue;const key='glico_alert_'+r.id+'_'+due.getTime();if(localStorage.getItem(key))continue;try{const n=new Notification('Lembrete GlicoVida',{body:'Você tem um lembrete de saúde programado. Abra o aplicativo para conferir.',tag:key});n.onclick=()=>{window.focus();go('reminders');n.close();};localStorage.setItem(key,'1');}catch(e){console.warn('Não foi possível exibir a notificação',e);}}}
function startReminderMonitor(){if(reminderMonitor)clearInterval(reminderMonitor);checkReminderAlerts();reminderMonitor=setInterval(checkReminderAlerts,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkReminderAlerts();});}
function addMeal(){let n=$('mealname').value.trim();if(!n)return alert('Informe a refeição.');data.meals.unshift({name:n,description:$('mealdesc').value,date:new Date().toISOString().slice(0,10)});save();render()};function addFamily(){alert('Convites reais ainda não estão disponíveis. Nenhum convite foi enviado.');return;let n=$('fname').value.trim();if(!n)return alert('Informe o nome.');data.family.push({name:n,relation:$('frelation').value||'Cuidador',scope:$('fscope').value});save();render()};function removeFamily(i){if(confirm('Revogar vínculo demonstrativo?')){data.family.splice(i,1);save();render()}}function askAI(){let q=$('question').value.trim();if(!q)return;data.messages.push({who:'me',text:q});let a=/consulta|médic|exame/i.test(q)?'Você pode levar seus registros de glicemia, lista de medicamentos, horários, dúvidas e observações para conversar com sua equipe de saúde.':/alimenta|comer|carboidrato/i.test(q)?'A alimentação deve ser planejada individualmente. Um nutricionista pode ajudar a entender carboidratos, fibras e horários das refeições.':/insulina|dose|hipoglicemia|hiperglicemia|sintoma|urgência/i.test(q)?'Não posso avaliar sintomas nem orientar doses ou tratamentos. Siga o plano definido pela sua equipe de saúde. Em situação urgente, procure atendimento médico.':'Posso ajudar a organizar registros, lembretes e perguntas para consultas. Para decisões de tratamento, converse com um profissional de saúde.';data.messages.push({who:'bot',text:a});save();render()};function rename(){data.name=$('newname').value.trim()||data.name;save();render()};function resetDemo(){if(confirm('Limpar dados temporários desta sessão?')){data={...structuredClone(defaults),role:data.role,name:data.name};render()}};startApp();
</script></body></html>
